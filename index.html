<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244ac2"><meta name="description" content="Rutina, calendario y registro de entrenamiento."><title>Mi semana · Rutina</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css?v=bento1"></head>
<body>
<header><a class="brand" href="./"><span class="mark">✓</span> mi semana</a><a class="today-link" href="#routine-block">Entrenar ↓</a></header>
<main>
<section class="goal-panel bento" aria-labelledby="goal-title">
 <div class="goal-heading"><div><p class="eyebrow">OCTUBRE — DICIEMBRE 2026</p><h2 id="goal-title">Mi objetivo</h2></div><button id="goal-edit" class="quiet">Editar</button></div>
 <p id="goal-text"></p><form id="goal-form" hidden><label>Objetivo<textarea id="goal-input" maxlength="500" required rows="3"></textarea></label><button type="submit">Guardar</button><button id="goal-cancel" type="button">Cancelar</button></form>
</section>
<section class="calendar-panel bento" aria-label="Calendario de seguimiento">
 <div class="calendar-heading"><div class="calendar-month"><button id="calendar-prev" aria-label="Mes anterior">‹</button><h2 id="calendar-month"></h2><button id="calendar-next" aria-label="Mes siguiente">›</button></div><span id="calendar-progress"></span></div>
 <div class="goal-calendar" id="goal-calendar" aria-label="Marcar días cumplidos"></div>
</section>
<section id="routine-block" class="routine-panel bento" aria-labelledby="routine-title">
 <div class="week-heading"><div><p class="eyebrow" id="week-label"></p><h1 id="routine-title">Rutina</h1></div><div class="week-progress"><strong id="weekly">0</strong><span>completados</span></div></div>
 <nav id="days" aria-label="Días de la semana"></nav>
 <div class="workspace"><section aria-labelledby="day-title"><div class="day-heading"><h2 id="day-title"></h2><div class="day-controls"><span id="progress" class="pill"></span><button id="edit" class="quiet">Editar</button></div></div>
 <label class="phase-select">Etapa<select id="training-phase"><option value="adaptation">Adaptación · 2 semanas</option><option value="target">Volumen objetivo</option></select></label><div class="progress-track"><div id="progress-bar"></div></div><div id="exercises"></div></section>
 <aside><div class="timer-panel"><div class="timer-readout"><div><h2 id="timer-title">Descanso</h2><p id="timer-exercise"></p><p id="timer-state" role="status" aria-live="polite">Listo</p></div><div id="clock" role="timer" aria-label="Tiempo restante">01:00</div></div><div class="timer-config"><div class="presets" aria-label="Duración del descanso"><button data-seconds="30">30 s</button><button data-seconds="60" class="selected">60 s</button><button data-seconds="90">90 s</button></div><label class="custom-time"><input id="custom" aria-label="Segundos de descanso" type="number" min="1" max="7200" value="60"> s</label></div><div class="timer-buttons"><button id="start" class="primary">Iniciar descanso</button><button id="pause" disabled>Pausar</button><button id="reset">Reiniciar</button></div></div></aside></div>
</section>
</main>
<dialog id="editor"><form id="edit-form"><div class="modal-heading"><h2>Editar rutina</h2><button type="button" id="close" aria-label="Cerrar">✕</button></div><label>Nombre del día<input id="edit-title" required maxlength="80"></label><div id="edit-rows"></div><button type="button" id="add">+ Añadir ejercicio</button><div class="modal-footer"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Guardar cambios</button></div></form></dialog>
<dialog id="image-view"><div class="modal-heading"><h2 id="image-title"></h2><button id="image-close" aria-label="Cerrar ilustración">✕</button></div><img id="large-image" alt=""><details class="image-advice"><summary>Técnica</summary><p id="image-tip"></p></details></dialog>
<div id="toast" role="status"></div>
<script src="app.js?v=bento1" defer></script><script src="voice.js?v=beats1" defer></script><script src="guide.js?v=beats1" defer></script><script src="training-log.js" defer></script><script src="calendar.js?v=bento1" defer></script>
</body></html>
