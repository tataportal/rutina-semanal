<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244ac2"><meta name="description" content="Tu rutina semanal, con ejercicios ilustrados, progreso y temporizador de descanso."><title>Mi semana · Rutina</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./"><span class="mark">✓</span> mi semana</a><button id="edit" class="quiet">Editar este día</button></header>
<main><div class="week-heading"><div><p class="eyebrow" id="week-label"></p><h1>Rutina semanal</h1></div><div class="week-progress"><strong id="weekly">0</strong><span>ejercicios completados<br>esta semana</span></div></div><nav id="days" aria-label="Días de la semana"></nav>
<div class="workspace"><section aria-labelledby="day-title"><div class="day-heading"><div><h2 id="day-title"></h2></div><span id="progress" class="pill"></span></div><label class="phase-select">Volumen de trabajo<select id="training-phase"><option value="adaptation">Primeras 2 semanas · adaptación</option><option value="target">Volumen objetivo</option></select></label><div class="progress-track"><div id="progress-bar"></div></div><div id="exercises"></div></section>
<aside><div class="timer-panel"><h2 id="timer-title">Descanso</h2><p id="timer-exercise">Elige un descanso para empezar.</p><div id="clock" role="timer" aria-label="Tiempo restante">01:00</div><p id="timer-state" role="status" aria-live="polite">Listo cuando tú estés</p><div class="presets" aria-label="Duración del descanso"><button data-seconds="30">30 s</button><button data-seconds="60" class="selected">60 s</button><button data-seconds="90">90 s</button></div><label class="custom-time">Tiempo personalizado <input id="custom" type="number" min="1" max="7200" value="60"> s</label><button id="start" class="primary">Iniciar descanso</button><div class="timer-actions"><button id="pause" disabled>Pausar</button><button id="reset">Reiniciar</button></div><p class="timer-note">El tiempo continúa al cambiar de día o cerrar la página.</p></div></aside></div></main>
<dialog id="editor"><form id="edit-form"><div class="modal-heading"><h2>Editar rutina</h2><button type="button" id="close" aria-label="Cerrar">✕</button></div><label>Nombre del día<input id="edit-title" required maxlength="80"></label><div id="edit-rows"></div><button type="button" id="add">+ Añadir ejercicio</button><div class="modal-footer"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Guardar cambios</button></div></form></dialog><dialog id="image-view"><div class="modal-heading"><h2 id="image-title"></h2><button id="image-close" aria-label="Cerrar ilustración">✕</button></div><img id="large-image" alt=""><p id="image-tip"></p></dialog><div id="toast" role="status"></div><script src="app.js" defer></script><script src="guide.js" defer></script><script src="training-log.js" defer></script></body></html>
